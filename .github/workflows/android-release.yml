name: Build signed Android App Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate signing and Firebase secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure Android signing and Firebase
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF
          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_SDK_ROOT
          EOF

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3 --distribution-type all
          chmod +x gradlew

      - name: Resolve packages and build signed AAB
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: investlearn-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

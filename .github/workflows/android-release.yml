
name: Build signed Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
       - name: Install Android SDK packages
  shell: bash
  run: |
    set -euo pipefail

    SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

    echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
    echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

    SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

    if [ ! -x "$SDKMANAGER" ]; then
      echo "Android SDK manager not found: $SDKMANAGER"
      exit 1
    fi

    echo "Accepting Android SDK licences..."

    set +o pipefail
    yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
    LICENSE_STATUS=${PIPESTATUS[1]}
    set -o pipefail

    if [ "$LICENSE_STATUS" -ne 0 ]; then
      echo "Android SDK licence acceptance failed."
      exit 1
    fi

    echo "Installing Android SDK packages..."

    "$SDKMANAGER" --sdk_root="$SDK" \
      "cmdline-tools;latest" \
      "platform-tools" \
      "platforms;android-35" \
      "platforms;android-36" \
      "build-tools;35.0.0" \
      "build-tools;36.0.0"

    echo "Android SDK installation completed."


      # 4. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      # 5. Set up Gradle 9.3.1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 6. Configure Flutter SDK
      - name: Configure Android local properties
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android

          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_HOME
          EOF

          test -f android/local.properties

      # 7. Resolve Flutter dependencies
      - name: Resolve Flutter dependencies
        run: flutter pub get

      # 8. Validate GitHub secrets
      - name: Validate signing and Firebase secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          for name in \
            KEYSTORE_BASE64 \
            KEY_ALIAS \
            KEY_PASSWORD \
            STORE_PASSWORD \
            GOOGLE_SERVICES_JSON
          do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          echo "All required secrets are available."

      # 9. Configure Android signing and Firebase
      - name: Configure Android signing and Firebase
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          # Decode keystore
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          # Verify keystore and alias
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Keystore verified."

          # Configure Firebase
          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          python3 -c '
          import json

          path = "android/app/google-services.json"

          with open(path) as f:
              data = json.load(f)

          expected = "com.gladstargtschool6.investlearn"

          clients = data.get("client", [])

          if not any(
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name") == expected
              for c in clients
          ):
              raise SystemExit("Firebase package name mismatch")

          print("Firebase configuration verified.")
          '

          # Generate signing properties
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF

          test -s android/key.properties

          echo "Signing configuration completed."

      # 10. Generate Gradle wrapper
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd android

          mkdir -p gradle/wrapper

          # Set required wrapper version before Gradle configuration
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Generate wrapper scripts
          gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type all

          chmod +x gradlew

          ./gradlew --version

      # 11. Build signed Android App Bundle
      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      # 12. Verify generated AAB
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="build/app/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          echo "AAB successfully generated."

          ls -lh "$AAB"

          jarsigner -verify "$AAB"

          echo "AAB signature verification completed."

      # 13. Upload signed AAB
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: gladstar-gt-school-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

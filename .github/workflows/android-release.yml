
name: Build signed Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Configure Android local properties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android

          cat > android/local.properties <<EOF
          flutter.sdk=$FLUTTER_ROOT
          sdk.dir=$ANDROID_HOME
          EOF

          test -s android/local.properties
          echo "Android local properties configured."

      - name: Update Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="android/settings.gradle.kts"
          PROPERTIES="android/gradle.properties"

          test -f "$SETTINGS"
          touch "$PROPERTIES"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          content = path.read_text()

          # Set Android Gradle Plugin version.
          content, count = re.subn(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>9.3.1\g<2>',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not update AGP version. "
                  "Check android/settings.gradle.kts."
              )

          # Remove external Kotlin plugin declaration.
          content = re.sub(
              r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*?\n',
              '',
              content,
              flags=re.MULTILINE
          )

          if 'id("com.android.application") version "9.3.1" apply false' not in content:
              raise SystemExit("AGP 9.3.1 configuration not found.")

          if "org.jetbrains.kotlin.android" in content:
              raise SystemExit(
                  "External Kotlin plugin declaration still exists."
              )

          path.write_text(content)

          print("AGP 9.3.1 verified.")
          print("External Kotlin plugin declaration removed.")
          PY

          # Enable AGP built-in Kotlin.
          sed -i '/^android\.builtInKotlin=/d' "$PROPERTIES"
          sed -i '/^android\.newDsl=/d' "$PROPERTIES"

          echo 'android.builtInKotlin=true' >> "$PROPERTIES"

          echo "Android Gradle configuration:"
          grep -E 'com.android.application|org.jetbrains.kotlin.android' "$SETTINGS" || true
          cat "$PROPERTIES"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Validate signing and Firebase secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          for name in \
            KEYSTORE_BASE64 \
            KEY_ALIAS \
            KEY_PASSWORD \
            STORE_PASSWORD \
            GOOGLE_SERVICES_JSON
          do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          echo "All required secrets are available."

      - name: Configure Android signing and Firebase
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          # Decode existing Android keystore.
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          # Verify the existing alias and store password.
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Keystore verified."

          # Write Firebase configuration.
          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          # Verify Firebase Android package name.
          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path) as f:
              data = json.load(f)

          expected = "com.gladstargtschool6.investlearn"

          clients = data.get("client", [])

          if not any(
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name") == expected
              for c in clients
          ):
              raise SystemExit("Firebase package name mismatch.")

          print("Firebase configuration verified.")
          PY

          # Generate Android signing properties.
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF

          test -s android/key.properties
          echo "Signing configuration completed."

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd android

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          gradle wrapper \
            --gradle-version 9.5.0 \
            --distribution-type all

          chmod +x gradlew

          ./gradlew --version

      - name: Check Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android Gradle files..."

          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle.properties

          grep -q 'com.android.application' android/settings.gradle.kts

          if grep -q 'org.jetbrains.kotlin.android' android/settings.gradle.kts; then
            echo "External Kotlin plugin must be removed for this migration."
            exit 1
          fi

          grep -q 'android.builtInKotlin=true' android/gradle.properties

          echo "Basic Android Gradle checks passed."

      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail

          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then
            echo "AAB file was not generated."
            exit 1
          fi

          echo "AAB successfully generated."
          ls -lh "$AAB"

          jarsigner -verify "$AAB"

          echo "AAB signature verification completed."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: gladstar-gt-school-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
